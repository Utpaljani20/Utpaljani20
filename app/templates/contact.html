{% extends "base.html"%}
{% block title %}SkinBuzz | Contact Us{% endblock %}
{% block content %}
<style>
    #Contact-container {
        padding: 100px 5% 50px; /* Top padding for navbar space */
        min-height: 80vh;
        background-color: #f8f9fa; /* Light grey background */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .contact-title {
        font-size: 2.5rem;
        color:#FE320A;  /* Purple theme */
        margin-bottom: 40px;
        font-weight: bold;
    }

    .contact-wrapper {
        display: flex;
        gap: 30px;
        width: 100%;
        max-width: 1100px;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Left Side: Form */
    #part1 {
        flex: 1;
        padding: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background-color: #fafafa;
        outline: none;
    }

    .send-btn {
        background-color: #FE320A; /* Purple theme */
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }


    .send-btn:hover {
        background-color: #fe330ac7;
    }

    /* Right Side: Map */
    #part2 {
        flex: 1;
        border-radius: 15px;
        overflow: hidden;
        min-height: 400px;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Responsive for mobile */
    @media (max-width: 768px) {
        .contact-wrapper {
            flex-direction: column;
        }
    }
</style>

<div id="Contact-container">
    <h1 class="contact-title">Contact Us</h1>
    
    <div class="contact-wrapper">
        <div id="part1">
            <form action="{{ url_for('upload.sampark') }}" method="POST">
                <div class="form-group">
                    <input type="email" placeholder="email" required>
                </div>
                <div class="form-group">
                    <input type="text" placeholder="number" required>
                </div>
                <div class="form-group">
                    <textarea placeholder="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="send-btn">Send Message</button>
            </form>
        </div>

        <div id="part2">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3768.801465797496!2d72.8414704739534!3d19.160165849327377!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b64e5d731b6b%3A0x5fb7b2c6c9d74f30!2sVivek%20College%20of%20Commerce!5e0!3m2!1sen!2sin!4v1771675181436!5m2!1sen!2sin" 
            width="600" height="450" style="border:0;" 
            allowfullscreen="" loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
</iframe>
        </div>
    </div>
</div>
{% endblock %}
